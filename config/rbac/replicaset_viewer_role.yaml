# This rule is not used by the project churnless itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to apps.churnless.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: churnless
    app.kubernetes.io/managed-by: kustomize
  name: replicaset-viewer-role
rules:
- apiGroups:
  - apps.churnless.io
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.churnless.io
  resources:
  - replicasets/status
  verbs:
  - get
