apiVersion: apps.churnless.io/v1alpha1
kind: ReplicaSet
metadata:
  labels:
    app.kubernetes.io/name: churnless
    app.kubernetes.io/managed-by: kustomize
  name: replicaset-sample
spec:
  replicas: 2
  selector:
    matchLabels:
      app: replicaset-sample
  template:
    metadata:
      labels:
        app: replicaset-sample
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
