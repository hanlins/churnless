---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-churnless-io-v1alpha1-deployment
  failurePolicy: Fail
  name: mdeployment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - churnless.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - deployments
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-churnless-io-v1alpha1-replicaset
  failurePolicy: Fail
  name: mreplicaset-v1alpha1.kb.io
  rules:
  - apiGroups:
    - churnless.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - replicasets
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-churnless-io-v1alpha1-deployment
  failurePolicy: Fail
  name: vdeployment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - churnless.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - deployments
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-churnless-io-v1alpha1-replicaset
  failurePolicy: Fail
  name: vreplicaset-v1alpha1.kb.io
  rules:
  - apiGroups:
    - churnless.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - replicasets
  sideEffects: None
