apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- name: mdeployment-v1alpha1.kb.io
  matchConditions:
  - name: spec-create-or-change
    expression: request.operation != 'UPDATE' || oldObject == null || object.spec != oldObject.spec
- name: mreplicaset-v1alpha1.kb.io
  matchConditions:
  - name: spec-create-or-change
    expression: request.operation != 'UPDATE' || oldObject == null || object.spec != oldObject.spec
