apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- name: vdeployment-v1alpha1.kb.io
  matchConditions:
  - name: spec-create-or-change
    expression: request.operation != 'UPDATE' || oldObject == null || object.spec != oldObject.spec
- name: vreplicaset-v1alpha1.kb.io
  matchConditions:
  - name: spec-create-or-change
    expression: request.operation != 'UPDATE' || oldObject == null || object.spec != oldObject.spec
